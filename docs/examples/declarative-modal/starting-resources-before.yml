meta:
  version: 1.0.0
options:
- name: starting-resources
  display: GroupBox
  header: '{{resources}}'
  text: '{{resources.description}}'
  category:
  - Modal examples
  children:
  - name: goods-table
    display: Group
    text: '{{resources}}'
    table:
      rowHeader: '{{goods}}'
      columns:
      - name: normal
        header: '{{normal}}'
        width: 8rem
      - name: crusader
        header: '{{crusader}}'
        width: 8rem
      - name: deathmatch
        header: '{{deathmatch}}'
        width: 8rem
    children:
    - name: wood
      display: Group
      text: '{{wood}}'
      children:
      - url: startResources.startGoods.normal.wood
        text: '{{wood}}'
        display: Number
        contents:
          min: 0
          max: 1000000
          type: number
          value: 100
        name: normal-wood
      - url: startResources.startGoods.crusader.wood
        text: '{{wood}}'
        display: Number
        contents:
          min: 0
          max: 1000000
          type: number
          value: 100
        name: crusader-wood
      - url: startResources.startGoods.deathmatch.wood
        text: '{{wood}}'
        display: Number
        contents:
          min: 0
          max: 1000000
          type: number
          value: 150
        name: deathmatch-wood
