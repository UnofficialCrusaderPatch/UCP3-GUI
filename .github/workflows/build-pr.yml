name: 'Build for PR, upload asset'

on:
  pull_request:
    types: [review_requested, synchronize]
  workflow_dispatch: {}
  

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        
      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install app dependencies
        run: |
          npm ci
      - name: Test
        run: |
          npm run test -- --test-timeout=10000
      - name: Build
        run: |
          npm run tauri build -- --bundles none
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      - name: Package combined preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview
          Copy-Item src-tauri/target/release/UCP3-GUI.exe preview/
          Copy-Item resources/* preview/ -Recurse
          Copy-Item TEST-SCALING-RESIZE.md preview/README-TEST.md
          git rev-parse HEAD | Set-Content preview/SOURCE-COMMIT.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UCP3-GUI-PR366-367-test
          path: preview/
